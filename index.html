<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bio/CV</title>
    <meta name="description" content="Alexander Powers is a dancer and musician." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <p class="site-title"><a href="index.html">Alexander Powers</a></p>
        <nav class="site" aria-label="Primary">
          <a href="index.html" aria-current="page">Bio/CV</a>
          <a href="music/index.html">Music</a>
          <a href="dance/index.html">Dance</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <h1>Bio/CV</h1>
      <div class="page-content">
        <div id="bio-content" class="state">Loading&hellip;</div>
        <div id="bio-cv"></div>
      </div>
    </main>

    <footer class="site">
      <div class="wrap">&copy; <span id="year"></span> Alexander Powers</div>
    </footer>

    <script src="js/sanity.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      Sanity.fetchQuery('*[_type == "bio"][0]{content, cv}')
        .then(function (bio) {
          var contentEl = document.getElementById("bio-content");
          var cvEl = document.getElementById("bio-cv");

          if (!bio || !bio.content || !bio.content.length) {
            contentEl.textContent = "Bio coming soon.";
          } else {
            contentEl.classList.remove("state");
            contentEl.innerHTML = Sanity.renderPortableText(bio.content);
          }

          if (bio && bio.cv && bio.cv.asset && bio.cv.asset._ref) {
            var url = Sanity.urlForFile(bio.cv.asset._ref);
            cvEl.innerHTML =
              '<a class="cv-link" href="' +
              url +
              '" target="_blank" rel="noopener noreferrer">Download CV</a>';
          }
        })
        .catch(function (err) {
          document.getElementById("bio-content").textContent =
            "Unable to load content right now.";
          console.error(err);
        });
    </script>
  </body>
</html>
